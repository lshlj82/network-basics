<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network elements · interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4; --panel:#FFFFFF; --ink:#16243A; --muted:#5A6678; --rule:#D2D8E0; --rule-strong:#AEB7C4;
  --s:#3D6FD6; --i:#E0443A; --r:#2E9B5A; --off:#B8C0CC; --focus:#3D6FD6;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", "Times New Roman", Georgia, serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A25; --panel:#1B2432; --ink:#E5EAF1; --muted:#9AA6B7; --rule:#2D394B; --rule-strong:#4A586C;
    --s:#6A93EC; --i:#F0625A; --r:#4CC07E; --off:#56637A; --focus:#6A93EC;
  }
}
:root[data-theme="dark"]{
  --paper:#131A25; --panel:#1B2432; --ink:#E5EAF1; --muted:#9AA6B7; --rule:#2D394B; --rule-strong:#4A586C;
  --s:#6A93EC; --i:#F0625A; --r:#4CC07E; --off:#56637A; --focus:#6A93EC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:16px}
header h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0;letter-spacing:-.01em}
header .src{margin-left:auto;color:var(--muted);font-size:13px}

nav.tabs{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group .sec{font-family:var(--serif);font-size:15px;color:var(--muted);margin-right:4px;white-space:nowrap}
.tab{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab:hover{border-color:var(--rule-strong)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.panel{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.panel[hidden]{display:none}
.stage{background:var(--panel);border:1px solid var(--rule);border-radius:10px;position:relative;min-width:0}
.stage canvas.main{display:block;width:100%;height:min(74vh,760px);min-height:320px;touch-action:manipulation}
#p-bc canvas.main{height:min(44vh,440px);min-height:260px}
.stage canvas.traj{display:block;width:100%;height:min(32vh,320px);min-height:200px;border-top:1px solid var(--rule)}
.stage .hint{margin:0;padding:0 14px 10px;font-size:13px;color:var(--muted)}
.legend{position:absolute;right:14px;top:12px;display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:-1px}

.side{min-width:0}
.side h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.2;margin:0 0 6px}
.lead{margin:0 0 12px;color:var(--ink);max-width:62ch}
.formula{font-family:var(--serif);font-size:17px;background:var(--panel);border-left:3px solid var(--ink);padding:9px 12px;margin:0 0 14px;line-height:1.55;overflow-x:auto}
.formula i,.ctl i,.ro i,.lead i,.note i{font-family:var(--serif);font-style:italic}
.formula small{font-family:var(--sans);font-size:12.5px;color:var(--muted);display:block;margin-top:2px}

.controls{display:grid;gap:9px;margin-bottom:12px}
.ctl{display:grid;grid-template-columns:minmax(118px,auto) 1fr 52px;align-items:center;gap:10px;font-size:14px}
.ctl label{color:var(--muted)}
.ctl output{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:15px}
.ctl input[type=range]{width:100%;accent-color:var(--ink)}
.ctl select{grid-column:2 / 4;font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--panel);color:var(--ink)}

.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.btn{font:inherit;font-size:14px;padding:7px 13px;border-radius:7px;border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:72px}
.btn:disabled{opacity:.5;cursor:default}

.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px 14px;margin:0 0 14px}
.ro{border-top:1px solid var(--rule);padding-top:5px}
.ro dt{font-size:12.5px;color:var(--muted)}
.ro dd{margin:0;font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.status{font-size:14px;color:var(--muted);margin:-6px 0 12px;min-height:1.5em}

.chart{margin-bottom:12px}
.chart figcaption{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.chart canvas{display:block;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
.refs{margin-top:14px;border-top:1px solid var(--rule);padding-top:8px;font-size:13.5px}
.refs summary{cursor:pointer;color:var(--ink);font-weight:500}
.refs ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.refs li{margin-bottom:6px;max-width:62ch}
.refs li i{font-family:var(--serif);font-style:italic}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px}
footer i{font-family:var(--serif)}
.note{font-size:13.5px;color:var(--muted);max-width:62ch;margin:6px 0 0}

@media (max-width:900px){
  .panel{grid-template-columns:1fr}
  .stage canvas.main{height:min(62vh,560px)}
  header .src{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

:root{--y:#D9A11E;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--y:#E8BC52}}
:root[data-theme="dark"]{--y:#E8BC52}
.code{margin:0 0 12px}
.code figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.code .copy{font:inherit;font-size:12px;border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);border-radius:5px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.code pre{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre}
.binom{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;position:relative;padding:0 7px;font-size:.92em}
.binom::before,.binom::after{content:"";position:absolute;top:1px;bottom:1px;width:5px;border:1.2px solid currentColor}
.binom::before{left:0;border-right:none;border-radius:7px 0 0 7px}
.binom::after{right:0;border-left:none;border-radius:0 7px 7px 0}
.tablewrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:5px 5px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left;white-space:normal;min-width:96px}
table.data th{color:var(--muted);font-weight:500}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover{background:var(--paper)}
table.data tbody tr[aria-selected="true"]{background:var(--ink);color:var(--paper)}
table.data tbody tr:last-child td{border-bottom:none}
.sub-h{font-size:13px;color:var(--muted);margin:2px 0 6px;font-weight:500}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 6px}
.calc label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc input,.calc select{font:inherit;font-size:14px;padding:5px 7px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
.calc-out{font-family:var(--serif);font-size:16px;margin:0 0 14px;min-height:1.4em}
.stage canvas.sub{display:block;width:100%;height:min(32vh,320px);min-height:200px;border-top:1px solid var(--rule)}
#p-den canvas.main{height:min(42vh,420px);min-height:240px}
#p-adj canvas.main{height:min(68vh,660px);min-height:420px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Network elements</h1>
  <span class="src">Created by Claude Opus 5.5 based on the lecture slides by Sang Hoon Lee</span>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Topics"></nav>
<main id="panels"></main>
<footer>Interactive companion to the lecture “Network elements” (Chapter 1 of <i>A First Course in Network Science</i>). Created by Claude Opus 5.5 based on the lecture slides by Sang Hoon Lee.</footer>
</div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const ri=n=>Math.floor(Math.random()*n);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const pct=x=>(100*x).toFixed(x<0.1&&x>0?1:0)+'%';

let TK={};
function readTokens(){const cs=getComputedStyle(document.documentElement);
  ['--paper','--panel','--ink','--muted','--rule','--rule-strong','--s','--i','--r','--off','--y'].forEach(k=>TK[k.slice(2)]=cs.getPropertyValue(k).trim());}
readTokens();

function fitCanvas(cv){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;
  const w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return {ctx,w:r.width,h:r.height};}

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function ramp(t){const a=hex2rgb(TK.s),m=[150,96,200],b=hex2rgb(TK.i);let c;
  if(t<.5){const u=t*2;c=a.map((v,k)=>v+(m[k]-v)*u);}else{const u=(t-.5)*2;c=m.map((v,k)=>v+(b[k]-v)*u);}
  return `rgb(${c.map(Math.round).join(',')})`;}

/* ---------- graphs ---------- */
function makeGraph(type,N,k){
  const adj=Array.from({length:N},()=>[]);const has=new Set();
  const add=(a,b)=>{if(a===b)return false;const key=a<b?a*N+b:b*N+a;if(has.has(key))return false;has.add(key);adj[a].push(b);adj[b].push(a);return true;};
  if(type==='ba'){
    const m=Math.max(1,Math.round(k/2));const tg=[];
    for(let i=0;i<=m;i++)for(let j=0;j<i;j++){add(i,j);tg.push(i,j);}
    for(let i=m+1;i<N;i++){const ch=new Set();let guard=0;while(ch.size<m&&guard++<1000)ch.add(tg[ri(tg.length)]);
      for(const c of ch){if(add(i,c))tg.push(i,c);}}
  }else{
    const M=Math.round(N*k/2);let guard=0;let e=0;while(e<M&&guard++<M*50){if(add(ri(N),ri(N)))e++;}
  }
  return finishGraph({N,adj,type});
}
function finishGraph(g){const N=g.N;let s=0,s2=0,mx=0,hub=0;
  for(let i=0;i<N;i++){const d=g.adj[i].length;s+=d;s2+=d*d;if(d>mx){mx=d;hub=i;}}
  g.k=s/N;g.k2=s2/N;g.kmax=mx;g.hub=hub;return g;}
function makeLattice(L){const n=L*L;const adj=Array.from({length:n},()=>[]);
    for(let y=0;y<L;y++)for(let x=0;x<L;x++){const i=y*L+x;if(x+1<L){adj[i].push(i+1);adj[i+1].push(i);}if(y+1<L){adj[i].push(i+L);adj[i+L].push(i);}}
    const gg=finishGraph({N:n,adj,type:'lat'});gg.px=new Float64Array(n);gg.py=new Float64Array(n);for(let i=0;i<n;i++){gg.px[i]=i%L;gg.py[i]=Math.floor(i/L);}return gg;}
function frLayout(g,iters,t0,init){
  const N=g.N;if(init||!g.px){g.px=new Float64Array(N);g.py=new Float64Array(N);
    for(let i=0;i<N;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*.5;g.px[i]=r*Math.cos(a);g.py[i]=r*Math.sin(a);}}
  const px=g.px,py=g.py,k=Math.sqrt(1/N),k2=k*k;const dx=new Float64Array(N),dy=new Float64Array(N);
  for(let it=0;it<iters;it++){const t=t0*(1-it/iters)+0.002;dx.fill(0);dy.fill(0);
    for(let i=0;i<N;i++){const xi=px[i],yi=py[i];for(let j=0;j<i;j++){const ax=xi-px[j],ay=yi-py[j];const d2=ax*ax+ay*ay+1e-9;const f=k2/d2;
      dx[i]+=ax*f;dy[i]+=ay*f;dx[j]-=ax*f;dy[j]-=ay*f;}}
    for(let a=0;a<N;a++){for(const b of g.adj[a]){if(b<a)continue;const ax=px[a]-px[b],ay=py[a]-py[b];const d=Math.sqrt(ax*ax+ay*ay)+1e-9;const f=d/k;
      dx[a]-=ax*f;dy[a]-=ay*f;dx[b]+=ax*f;dy[b]+=ay*f;}}
    for(let i=0;i<N;i++){dx[i]-=px[i]*k*4;dy[i]-=py[i]*k*4;const L=Math.sqrt(dx[i]*dx[i]+dy[i]*dy[i]);
      if(L>0){const s=Math.min(L,t)/L;px[i]+=dx[i]*s;py[i]+=dy[i]*s;}}
  }
}
function components(g){const N=g.N,c=new Int32Array(N).fill(-1);let n=0,big=0;
  for(let s=0;s<N;s++){if(c[s]>=0)continue;let sz=0;const q=[s];c[s]=n;while(q.length){const u=q.pop();sz++;for(const v of g.adj[u])if(c[v]<0){c[v]=n;q.push(v);}}
    big=Math.max(big,sz);n++;}return {n,big};}

/* ---------- network drawing ---------- */
function drawNet(cv,g,o){
  const {ctx,w,h}=fitCanvas(cv);ctx.clearRect(0,0,w,h);
  const pad=26;const xs=[],ys=[];
  for(let i=0;i<g.N;i++)if(g.adj[i].length){xs.push(g.px[i]);ys.push(g.py[i]);}
  if(!xs.length){for(let i=0;i<g.N;i++){xs.push(g.px[i]);ys.push(g.py[i]);}}
  xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);const q=Math.floor(xs.length*0.01);
  const x0=xs[q],x1=xs[xs.length-1-q],y0=ys[q],y1=ys[ys.length-1-q];
  const sc=Math.min((w-2*pad)/(x1-x0||1),(h-2*pad-18)/(y1-y0||1));
  const ox=(w-(x1-x0)*sc)/2-x0*sc,oy=(h-18-(y1-y0)*sc)/2-y0*sc+4;
  const X=i=>ox+clamp(g.px[i],x0,x1)*sc,Y=i=>oy+clamp(g.py[i],y0,y1)*sc;
  const base=clamp(Math.min(w,h)/Math.sqrt(g.N)*0.15,2.2,8);
  const rad=i=>o.sizeByDegree?base*(0.55+0.45*Math.sqrt(g.adj[i].length/(g.k||1))):base;
  ctx.lineCap='round';
  ctx.strokeStyle=TK['rule-strong'];ctx.lineWidth=0.7;ctx.globalAlpha=0.75;ctx.beginPath();
  for(let a=0;a<g.N;a++)for(const b of g.adj[a]){if(b<a)continue;if(o.edgeColor){continue;}ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b));}
  ctx.stroke();ctx.globalAlpha=1;
  if(o.edgeColor){for(let a=0;a<g.N;a++)for(const b of g.adj[a]){if(b<a)continue;const ec=o.edgeColor(a,b);
      ctx.strokeStyle=ec.c;ctx.lineWidth=ec.w||0.8;ctx.globalAlpha=ec.a??0.8;ctx.setLineDash(ec.dash||[]);ctx.beginPath();ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b));ctx.stroke();}
    ctx.setLineDash([]);ctx.globalAlpha=1;}
  if(o.highlight){for(const [a,b,ok] of o.highlight){ctx.strokeStyle=ok?TK.i:TK.muted;ctx.lineWidth=ok?2.4:1.2;ctx.setLineDash(ok?[]:[3,3]);
      ctx.beginPath();ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b));ctx.stroke();}ctx.setLineDash([]);}
  for(let i=0;i<g.N;i++){const r=rad(i);ctx.beginPath();ctx.arc(X(i),Y(i),r,0,6.2832);ctx.fillStyle=o.color(i);ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle=TK.panel;ctx.stroke();
    if(o.ring&&o.ring(i)){ctx.beginPath();ctx.arc(X(i),Y(i),r+2.6,0,6.2832);ctx.strokeStyle=TK.ink;ctx.lineWidth=1.6;ctx.stroke();}}
  cv._hit={X,Y,rad,N:g.N};
}
function hitNode(cv,e){const m=cv._hit;if(!m)return -1;const b=cv.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;
  let best=-1,bd=1e9;for(let i=0;i<m.N;i++){const d=Math.hypot(m.X(i)-x,m.Y(i)-y);if(d<bd){bd=d;best=i;}}
  return bd<=m.rad(best)+8?best:-1;}

/* ---------- charts ---------- */
function niceTicks(a,b,n){const span=b-a||1;const st=Math.pow(10,Math.floor(Math.log10(span/n)));const err=span/n/st;
  const step=st*(err>=7.5?10:err>=3.5?5:err>=1.5?2:1);const out=[];for(let v=Math.ceil(a/step)*step;v<=b+1e-9;v+=step)out.push(+v.toFixed(10));return out;}
function chart(cv,o){
  const {ctx,w,h}=fitCanvas(cv);ctx.clearRect(0,0,w,h);
  const L=o.left??40,R=o.right??12,T=12,B=o.xLabel?36:24;const pw=w-L-R,ph=h-T-B;
  const xa=o.xMin??0,xb=o.xMax,ya=o.yMin??0,yb=o.yMax??1;
  const X=x=>L+(x-xa)/(xb-xa)*pw,Y=y=>T+ph-(y-ya)/(yb-ya)*ph;
  ctx.font='11.5px "Instrument Sans", system-ui, sans-serif';ctx.fillStyle=TK.muted;ctx.strokeStyle=TK.rule;ctx.lineWidth=1;
  ctx.textAlign='right';ctx.textBaseline='middle';
  for(const v of niceTicks(ya,yb,o.yTicks||4)){ctx.beginPath();ctx.moveTo(L,Y(v));ctx.lineTo(L+pw,Y(v));ctx.stroke();ctx.fillText(o.yFmt?o.yFmt(v):v,L-6,Y(v));}
  ctx.textAlign='center';ctx.textBaseline='top';
  for(const v of niceTicks(xa,xb,o.xTicks||5)){ctx.fillText(o.xFmt?o.xFmt(v):v,X(v),T+ph+5);}
  ctx.strokeStyle=TK['rule-strong'];ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+ph);ctx.lineTo(L+pw,T+ph);ctx.stroke();
  if(o.xLabel){ctx.font='italic 13px "Source Serif 4", Georgia, serif';ctx.fillText(o.xLabel,L+pw/2,T+ph+19);}
  if(o.yLabel){ctx.save();ctx.translate(Math.max(11,L-44),T+ph/2);ctx.rotate(-Math.PI/2);ctx.font='italic 13px "Source Serif 4", Georgia, serif';ctx.textBaseline='middle';ctx.fillText(o.yLabel,0,0);ctx.restore();}
  ctx.save();ctx.beginPath();ctx.rect(L,T-2,pw,ph+4);ctx.clip();

/* runner: play/pause loop */
function attachRunner(m){
  let playing=false,last=0,acc=0;const P=m.ui;
  const setBtn=()=>{P.btn.play.textContent=playing?'Pause':'Play';};
  function frame(ts){if(!playing)return;const dt=Math.min(0.25,(ts-last)/1000);last=ts;acc+=dt*(m.speed?m.speed():P.vals.speed||5);
    let n=Math.floor(acc);acc-=n;n=Math.min(n,m.maxPerFrame||40);
    for(let i=0;i<n;i++){if(m.done()){stop();break;}m.step();}
    m.render();if(m.done())stop();if(playing)requestAnimationFrame(frame);}
  function start(){if(m.done())m.reset();playing=true;last=performance.now();acc=1;setBtn();requestAnimationFrame(frame);}
  function stop(){playing=false;setBtn();}
  P.btn.play.onclick=()=>playing?stop():start();
  if(P.btn.step)P.btn.step.onclick=()=>{stop();if(!m.done())m.step();m.render();};
  if(P.btn.reset)P.btn.reset.onclick=()=>{stop();m.reset();m.render();};
  m.stop=stop;m.isPlaying=()=>playing;setBtn();
}

(function(){

  function analysis(){const d=LAND.map((_,i)=>deg(i));const odd=d.filter(x=>x%2).length;const st=d.findIndex(x=>x>0);let conn=true;

    ui.out('L',bridges.length);ui.out('odd',A.odd);ui.out('ok',!bridges.length?'–':A.ok?(A.odd?'Yes (open)':'Yes (closed)'):'No');ui.out('done',`${used.length} / ${bridges.length}`);

    let li=-1;LAND.forEach((l,i)=>{if(Math.hypot(V.X(l.x)-px,V.Y(l.y)-py)<=R+6)li=i;});

        if(v){ctx.fillStyle=TK.s;ctx.globalAlpha=0.25+0.55*v/wmax;ctx.fillRect(x+1,y+1,cell-2,cell-2);ctx.globalAlpha=1;}

        txt(ctx,v,x+cell/2,y+cell/2+0.5,{font:`${v?'600 ':''}${Math.round(clamp(cell*0.36,10,15))}px ${SANS}`,color:v?TK.ink:TK.muted});
        if(hover&&hover.i===i&&hover.j===j){ctx.strokeStyle=TK.i;ctx.lineWidth=2.5;ctx.strokeRect(x+1,y+1,cell-2,cell-2);}
        cells.push({x,y,s:cell,i,j});}
      if(tag==='main'&&sel.size&&sel.size<n){ctx.strokeStyle=TK.ink;ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
        for(const i of S)for(const j of S)ctx.strokeRect(ox+j*cell+2.5,oy+i*cell+2.5,cell-5,cell-5);ctx.setLineDash([]);}};
    drawM(mx,my,[...Array(n).keys()],'main');
    if(pre.groups){ctx.strokeStyle=TK.i;ctx.setLineDash([4,3]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(mx,my+3*cell);ctx.lineTo(mx+n*cell,my+3*cell);ctx.moveTo(mx+3*cell,my);ctx.lineTo(mx+3*cell,my+n*cell);ctx.stroke();ctx.setLineDash([]);}
    if(showSub){const sy=my+n*cell+52;txt(ctx,`Subnetwork of nodes ${S.map(i=>i+1).join(', ')}`,mx+n*cell/2,sy-30,{font:`italic 14px ${SERIF}`,color:TK.muted});drawM(mx+(n-S.length)*cell/2,sy,S,'sub');}
    let L=0;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(A[i][j]&&(pre.dir||i<j))L++;let sL=0;for(const i of S)for(const j of S)if(A[i][j]&&(pre.dir||i<j))sL++;
    ui.out('N',n);ui.out('L',L);ui.out('sym',symmetric()?'yes':'no');ui.out('sN',S.length);ui.out('sL',sL);
    if(hover){const {i,j}=hover;const v=A[i][j];ui.status(`${pre.wt?'w':'a'}${i+1}${j+1} = ${v}: ${v?(pre.dir?`link from ${i+1} to ${j+1}`:`link between ${i+1} and ${j+1}`)+(pre.wt?` with weight ${v}`:''):`no link from ${i+1} to ${j+1}`}${pre.dir&&v&&A[j][i]?' (two-way)':pre.dir&&v?' (one-way)':''}.`);}
    else ui.status(symmetric()?'The matrix is symmetric, so every link goes both ways: an undirected network.':'The matrix is not symmetric: a directed network.');
    setCode(code());}
  const hit=(px,py)=>{for(let i=0;i<nodesPx.length;i++){const [x,y,r]=nodesPx[i];if(Math.hypot(x-px,y-py)<=r+4)return {t:'n',i};}
    for(const c of cells)if(px>=c.x&&px<c.x+c.s&&py>=c.y&&py<c.y+c.s)return {t:'c',i:c.i,j:c.j};
    let best=null,bd=7;for(const g of geo){const d=distToLink(g.g,px,py);if(d<bd){bd=d;best={t:'l',i:g.i,j:g.j};}}return best;};
  ui.canvas.addEventListener('pointermove',e=>{const [px,py]=evPos(ui.canvas,e);const h=hit(px,py);ui.canvas.style.cursor=h?'pointer':'default';
    const nh=h&&(h.t==='c'||h.t==='l')?{i:h.i,j:h.j}:null;if(JSON.stringify(nh)!==JSON.stringify(hover)){hover=nh;render();}});
  ui.canvas.addEventListener('pointerleave',()=>{if(hover){hover=null;render();}});
  ui.canvas.addEventListener('click',e=>{const [px,py]=evPos(ui.canvas,e);const h=hit(px,py);if(!h)return;
    if(h.t==='n'){sel.has(h.i)?sel.delete(h.i):sel.add(h.i);render();return;}
    if(h.t==='c'){const {i,j}=h;if(i===j){ui.status('The diagonal stays 0: no self-links in these networks.');return;}
      A[i][j]=A[i][j]?0:(pre.wt?(A0[i][j]||1):1);if(!pre.dir)A[j][i]=A[i][j];hover={i,j};render();}});
  ui.btn.all.onclick=()=>{sel=new Set([...Array(n).keys()]);render();};ui.btn.none.onclick=()=>{sel=new Set();render();};
  ui.btn.reset.onclick=()=>{A=A0.map(r=>r.slice());render();};
  register('c','adj','Adjacency matrix',{ui,init:load,render});
})();

/* =========================================================
   Multilayer and temporal networks
   ========================================================= */
(function(){
  const N=20;const grp=i=>i<10?0:1;
  const ui=buildPanel({id:'ml',title:'Multilayer and temporal networks',
    stageLabel:'Stacked layers of the same nodes with intralayer and interlayer links',
    legend:[['--i','group 1'],['--s','group 2'],['--r','interlayer links']],
    hint:'Click a node to follow it through the layers. Its interlayer links (green, dashed) join its copies: only adjacent layers for layers ordered in time, every pair of layers for categories.',
    lead:'Sometimes one network is not enough. The links among the same people can change over time (temporal layers in order), or people can interact in different ways (layers of different kinds). Intralayer links are the ordinary networks inside each layer; interlayer links usually join a node to its own copy in another layer.',
    formula:'<i>Q</i> = <sup>1</sup>⁄<sub>2<i>μ</i></sub> Σ<sub><i>ijsr</i></sub> [ (<i>A<sub>ijs</sub></i> − <i>γ<sub>s</sub></i> <i>k<sub>is</sub>k<sub>js</sub></i>/2<i>m<sub>s</sub></i>) <i>δ<sub>sr</sub></i> + <i>δ<sub>ij</sub></i> <i>C<sub>jsr</sub></i> ] <i>δ</i>(<i>g<sub>is</sub></i>, <i>g<sub>jr</sub></i>)<small>multilayer modularity for finding groups across layers (Mucha et al. 2010): the first term uses intralayer links in each layer s, the second the coupling C<sub>jsr</sub> of node j to itself between layers s and r; g<sub>is</sub> is the group of node i in layer s</small>',
    controls:[{type:'select',key:'kind',label:'Layers are',options:[['ord','Ordered in time'],['cat','Different kinds (categories)']],value:'ord'},
      {type:'select',key:'view',label:'View',options:[['stack','Stack of layers'],['agg','Aggregated static network']],value:'stack'},
      {type:'select',key:'inter',label:'Interlayer links',options:[['sel','For the selected node'],['all','For all nodes']],value:'sel'},
      {key:'n',label:'Number of layers',min:2,max:5,step:1,value:5}],
    buttons:[['new','New snapshots']],
    readouts:[['N','Nodes per layer'],['intra','Intralayer links'],['inter','Interlayer links'],['agg','Links in static network'],['always','Links in every layer']],
    charts:[['per','Intralayer links in each layer',120]],
    note:'The snapshots here are synthetic: two groups with dense links inside and few links between, much like the political retweet network on the slide. Aggregating over time gives one static, weighted network but loses when each link was active.',
    refs:[BOOK+' Section 1.8.','P. J. Mucha, T. Richardson, K. Macon, M. A. Porter, and J.-P. Onnela, “Community structure in time-dependent, multiscale, and multiplex networks,” <i>Science</i> 328, 876–878 (2010).',
      'M. Kivelä, A. Arenas, M. Barthelemy, J. P. Gleeson, Y. Moreno, and M. A. Porter, “Multilayer networks,” <i>Journal of Complex Networks</i> 2(3), 203–271 (2014).',
      'S. Boccaletti et al., “The structure and dynamics of multilayer networks,” <i>Physics Reports</i> 544(1), 1–122 (2014).',
      'P. Holme and J. Saramäki, “Temporal networks,” <i>Physics Reports</i> 519(3), 97–125 (2012).',
      'M. D. Conover et al., “Political polarization on Twitter,” <i>Proc. 5th International AAAI Conference on Weblogs and Social Media (ICWSM)</i>, 89–96 (2011).',
      'W. W. Zachary, “An information flow model for conflict and fission in small groups,” <i>Journal of Anthropological Research</i> 33(4), 452–473 (1977).'],
    onChange:k=>{if(k!=='n')render();},onInput:k=>{if(k==='n'){gen();render();}}
  });
  const setCode=addCode(ui,'NetworkX has no multilayer type: one way to encode it');
  let layers=[],agg=new Map(),pos=[],sel=0,hitPts=[];
  function gen(){const n=ui.vals.n;layers=[];const keep=0.6;
    for(let s=0;s<n;s++){const S=new Set();for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const p=grp(i)===grp(j)?0.3:0.02;const k=i*N+j;
        const on=s===0?Math.random()<p:(layers[s-1].has(k)?Math.random()<keep:Math.random()<p*(1-keep)/(1-p));if(on)S.add(k);}layers.push(S);}
    agg=new Map();for(const S of layers)for(const k of S)agg.set(k,(agg.get(k)||0)+1);
    const g={N,adj:Array.from({length:N},()=>[])};for(const k of agg.keys()){const i=Math.floor(k/N),j=k%N;g.adj[i].push(j);g.adj[j].push(i);}
    frLayout(g,300,0.1,true);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let i=0;i<N;i++){x0=Math.min(x0,g.px[i]);x1=Math.max(x1,g.px[i]);y0=Math.min(y0,g.py[i]);y1=Math.max(y1,g.py[i]);}
    pos=[...Array(N).keys()].map(i=>[0.1+0.8*(g.px[i]-x0)/(x1-x0||1),0.1+0.8*(g.py[i]-y0)/(y1-y0||1)]);}
  const col=i=>grp(i)?TK.s:TK.i;
  function render(){const {ctx,w,h}=fitCanvas(ui.canvas);ctx.clearRect(0,0,w,h);hitPts=[];const n=layers.length,cat=ui.vals.kind==='cat';
    if(ui.vals.view==='stack'){const pad=22;const uw=Math.min(w*0.42,(w-2*pad)/(n+0.15)*0.94);const uy=-Math.min(uw*0.35,h*0.08);const vh=Math.min(h*0.66,h-2*pad-60);
      const sx=n>1?(w-2*pad-uw)/(n-1):0,sy=n>1?Math.max(0,(h-2*pad-26-Math.abs(uy)-vh)/(n-1)):0;
      const Pt=(s,u,v)=>[pad+s*sx+u*uw,pad+Math.abs(uy)+s*sy+u*uy+v*vh];const r=clamp(uw/55,3.2,6);
      for(let s=n-1;s>=0;s--){const c=[Pt(s,0,0),Pt(s,1,0),Pt(s,1,1),Pt(s,0,1)];ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
        ctx.fillStyle=TK.panel;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=TK['rule-strong'];ctx.lineWidth=1;ctx.stroke();
        txt(ctx,cat?`layer ${s+1}`:`t = ${s+1}`,c[2][0]-8,c[2][1]-10,{align:'right',font:`italic 13px ${SERIF}`,color:TK.muted});
        ctx.lineWidth=0.8;for(const k of layers[s]){const i=Math.floor(k/N),j=k%N;const hi=i===sel||j===sel;const a=Pt(s,...pos[i]),b=Pt(s,...pos[j]);
          ctx.strokeStyle=hi?TK.ink:grp(i)===grp(j)?col(i):TK.muted;ctx.globalAlpha=hi?0.9:0.4;ctx.lineWidth=hi?1.6:0.8;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
        ctx.globalAlpha=1;for(let i=0;i<N;i++){const p=Pt(s,...pos[i]);ctx.beginPath();ctx.arc(p[0],p[1],i===sel?r+1.5:r,0,6.3);ctx.fillStyle=col(i);ctx.fill();
          if(i===sel){ctx.lineWidth=2;ctx.strokeStyle=TK.ink;ctx.stroke();}hitPts.push([p[0],p[1],i]);}}
      const who=ui.vals.inter==='all'?[...Array(N).keys()]:[sel];
      for(const i of who){const one=who.length===1;for(let s=0;s<n;s++)for(let t=s+1;t<n;t++){if(!cat&&t!==s+1)continue;
          drawLink(ctx,Pt(s,...pos[i]),Pt(t,...pos[i]),{bend:(t-s-1)*18,color:TK.r,width:one?1.8:0.9,dash:[5,4],alpha:one?0.95:0.35});}}}
    else{const V=fitRect(ctx,{x:0,y:0,w,h},[0,0,1,1],30);const r=clamp(V.s*0.018,5,10);
      for(const [k,c] of agg){const i=Math.floor(k/N),j=k%N;const hi=i===sel||j===sel;ctx.strokeStyle=hi?TK.ink:grp(i)===grp(j)?col(i):TK.muted;ctx.globalAlpha=hi?0.9:0.55;
        ctx.lineWidth=0.6+1.3*(c-1)+(hi?0.6:0);ctx.beginPath();ctx.moveTo(V.X(pos[i][0]),V.Y(pos[i][1]));ctx.lineTo(V.X(pos[j][0]),V.Y(pos[j][1]));ctx.stroke();}
      ctx.globalAlpha=1;for(let i=0;i<N;i++){const x=V.X(pos[i][0]),y=V.Y(pos[i][1]);ctx.beginPath();ctx.arc(x,y,i===sel?r+2:r,0,6.3);ctx.fillStyle=col(i);ctx.fill();
        if(i===sel){ctx.lineWidth=2;ctx.strokeStyle=TK.ink;ctx.stroke();}hitPts.push([x,y,i]);}
      txt(ctx,`Line width = number of the ${n} ${cat?'layers':'snapshots'} that contain the link`,w/2,h-12,{color:TK.muted,font:`13px ${SANS}`});}
    const intra=layers.reduce((a,S)=>a+S.size,0);const inter=cat?N*n*(n-1)/2:N*(n-1);let always=0;for(const c of agg.values())if(c===n)always++;
    ui.out('N',N);ui.out('intra',intra);ui.out('inter',inter);ui.out('agg',agg.size);ui.out('always',always);
    let deg=0;for(const k of agg.keys()){if(Math.floor(k/N)===sel||k%N===sel)deg++;}const per=layers.map(S=>{let d=0;for(const k of S)if(Math.floor(k/N)===sel||k%N===sel)d++;return d;});
    ui.status(`Node ${sel+1} (group ${grp(sel)+1}): degree ${per.join(', ')} in the ${cat?'layers':'snapshots'}; ${deg} distinct neighbors overall.`);
    const c=degBars(ui.charts.per,[0,...layers.map(S=>S.size)],{yMax:Math.max(...layers.map(S=>S.size))*1.2,xLabel:cat?'layer':'t',xFmt:v=>Number.isInteger(v)&&v>=1?String(v):'',yFmt:v=>Number.isInteger(v)?v:''});
    setCode(`import networkx as nx${cat?'\nimport itertools':''}\n\nM = nx.Graph()   # node i in layer s is the tuple (i, s)\nfor s, layer in enumerate(layers):            # intralayer links\n    M.add_edges_from(((i, s), (j, s)) for i, j in layer)\n`+
      (cat?`for i in nodes:                                # interlayer links: all pairs of layers\n    for s, r in itertools.combinations(range(len(layers)), 2):\n        M.add_edge((i, s), (i, r), weight=omega)\n`:`for i in nodes:                                # interlayer links: adjacent layers\n    for s in range(len(layers) - 1):\n        M.add_edge((i, s), (i, s + 1), weight=omega)\n`)+
      `\nS = nx.Graph()   # aggregated static network\nfor layer in layers:\n    for i, j in layer:\n        w = S.get_edge_data(i, j, {"weight": 0})["weight"]\n        S.add_edge(i, j, weight=w + 1)\n`);}
  ui.canvas.addEventListener('click',e=>{const [px,py]=evPos(ui.canvas,e);let b=-1,bd=10;for(const [x,y,i] of hitPts){const d=Math.hypot(x-px,y-py);if(d<bd){bd=d;b=i;}}if(b>=0){sel=b;render();}});
  ui.canvas.addEventListener('pointermove',e=>{const [px,py]=evPos(ui.canvas,e);ui.canvas.style.cursor=hitPts.some(([x,y])=>Math.hypot(x-px,y-py)<10)?'pointer':'default';});
  ui.btn.new.onclick=()=>{gen();render();};
  register('d','ml','Multilayer & temporal',{ui,init:()=>{gen();render();},render});
})();

/* ---------- tabs ---------- */
const nav=$('#tabs');let current=null;const inited=new Set();
for(const gr of groups){const d=el(`<div class="group"><span class="sec">${gr.name}</span></div>`);
  for(const tb of gr.tabs){const b=el(`<button class="tab" role="tab" id="tab-${tb.id}" aria-controls="p-${tb.id}" aria-selected="false">${tb.label}</button>`);b.onclick=()=>select(tb.id);d.append(b);}
  nav.append(d);}
function select(id){if(current&&models[current].stop)models[current].stop();
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+id);
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.id==='tab-'+id));
  current=id;try{history.replaceState(null,'','#'+id);}catch(e){}
  requestAnimationFrame(()=>{if(!inited.has(id)){inited.add(id);models[id].init();}else models[id].render();});}
const start=(location.hash||'').slice(1);select(models[start]?start:'deg');

new ResizeObserver(()=>{if(current&&inited.has(current))models[current].render();}).observe($('#panels'));
const mq=matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener('change',()=>{readTokens();models[current].render();}):null);
document.fonts&&document.fonts.ready.then(()=>{if(current&&inited.has(current))models[current].render();});
